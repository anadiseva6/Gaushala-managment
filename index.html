<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#14532d"/>
  <title>Gaushala Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{brand:{50:"#f0fdf4",100:"#dcfce7",600:"#16a34a",700:"#15803d",800:"#166534",900:"#14532d"}}}}}
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
  <style>
    body{background:#f6f8f6}.scrollbar::-webkit-scrollbar{width:7px;height:7px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5ce;border-radius:20px}
    .nav-active{background:#dcfce7;color:#14532d;font-weight:700}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 8px rgba(16,24,16,.035)}
    .input{width:100%;border:1px solid #d7ded9;border-radius:10px;padding:.62rem .75rem;outline:none;background:white}.input:focus{border-color:#65a30d;box-shadow:0 0 0 3px #ecfccb}
    .btn{border-radius:10px;padding:.62rem .9rem;font-weight:700;display:inline-flex;align-items:center;gap:.45rem}.btn-primary{background:#166534;color:white}.btn-primary:hover{background:#14532d}.btn-soft{background:#eef5ef;color:#245234}.btn-danger{background:#fee2e2;color:#991b1b}
    .badge{font-size:.72rem;font-weight:700;border-radius:999px;padding:.25rem .55rem;display:inline-block}.toast{animation:in .2s ease}@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    .modal-bg{background:rgba(4,15,8,.48)}.hide-scroll::-webkit-scrollbar{display:none}
  </style>
</head>
<body class="text-slate-800">
<div id="app"></div>
<div id="toast" class="fixed bottom-5 right-5 z-[100]"></div>
<div id="modalRoot"></div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyB4SZAFtG5FGdXkfWaKhvaw6r7UFfmcekw",
  authDomain:"gaushala-managment.firebaseapp.com",
  databaseURL:"https://gaushala-managment-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gaushala-managment",
  storageBucket:"gaushala-managment.firebasestorage.app",
  messagingSenderId:"204886706588",
  appId:"1:204886706588:web:102c6b87a40771c85a2059",
  measurementId:"G-72D440YMX5"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), auth=firebase.auth();

const state={
  page:"Dashboard", data:{}, search:"", modal:null, role:"Owner / Admin",
  cloud:{name:localStorage.cloudinaryName||"",preset:localStorage.cloudinaryPreset||""}
};
const modules={
  Dashboard:["🏠","Dashboard"], Animals:["🐄","Animals"], Pregnancy:["🤰","Pregnancy"], Calves:["🐮","Calves"],
  Milk:["🥛","Milk"], Feed:["🌾","Feed"], Health:["❤️","Health"], Medicines:["💊","Medicines"],
  Vaccination:["💉","Vaccination"], Deworming:["🛡️","Deworming"], "Tick Control":["🪲","Tick Control"],
  Sheds:["🏠","Sheds"], Workers:["👷","Workers"], Tasks:["☑️","Tasks"], Expenses:["₹","Expenses"], Reports:["📊","Reports"], Settings:["⚙️","Settings"]
};
const paths=["animals","pregnancies","calvings","milkRecords","healthChecks","treatments","medicines","vaccinations","deworming","tickControl","feedInventory","feedRecords","sheds","workers","tasks","expenses","income","quarantine","movements","births","notifications"];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function id(prefix){return prefix+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function fmt(d){if(!d)return"—";return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function badge(s){
  let c="bg-slate-100 text-slate-700"; if(["Healthy","Completed","Lactating"].includes(s))c="bg-green-100 text-green-800";
  if(["Pregnant","Under Treatment"].includes(s))c="bg-violet-100 text-violet-800"; if(["Sick","Emergency","Overdue"].includes(s))c="bg-red-100 text-red-800";
  if(["Pending","Quarantine","Dry"].includes(s))c="bg-amber-100 text-amber-800"; return `<span class="badge ${c}">${esc(s||"—")}</span>`
}
function toast(msg,ok=true){document.getElementById("toast").innerHTML=`<div class="toast card px-4 py-3 flex items-center gap-2 ${ok?"text-green-800":"text-red-800"}">${ok?"✓":"⚠"} ${esc(msg)}</div>`;setTimeout(()=>document.getElementById("toast").innerHTML="",3000)}
async function save(path,key,data){if(!key)key=id(path.slice(0,-1).toUpperCase()||"REC");data.updatedAt=new Date().toISOString();await db.ref(`${path}/${key}`).set({...data,id:key});return key}
async function remove(path,key){await db.ref(`${path}/${key}`).remove()}
function list(path){return Object.values(state.data[path]||{})}
function animals(){return list("animals")}
function findAnimal(id){return animals().find(a=>a.id===id)}
function modal(title,body,actions=""){document.getElementById("modalRoot").innerHTML=`<div class="modal-bg fixed inset-0 z-50 p-4 flex items-center justify-center"><div class="bg-white rounded-2xl w-full max-w-3xl max-h-[92vh] overflow-auto scrollbar"><div class="p-5 border-b flex justify-between items-center"><h3 class="font-bold text-lg">${title}</h3><button onclick="closeModal()" class="text-2xl text-slate-400">×</button></div><div class="p-5">${body}</div>${actions?`<div class="p-5 border-t flex justify-end gap-2">${actions}</div>`:""}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function field(label,name,value="",type="text",extra=""){return `<label class="block text-sm font-semibold text-slate-600">${label}<input ${extra} class="input mt-1" name="${name}" type="${type}" value="${esc(value)}"></label>`}
function select(label,name,opts,value=""){return `<label class="block text-sm font-semibold text-slate-600">${label}<select class="input mt-1" name="${name}">${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
function formGrid(html){return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${html}</div>`}
function nav(){
  return Object.entries(modules).map(([k,[i,l]])=>`<button onclick="go('${k}')" class="w-full text-left px-3 py-2.5 rounded-xl flex gap-3 items-center ${state.page===k?"nav-active":"text-slate-500 hover:bg-slate-100"}">${i}<span>${l}</span></button>`).join("")
}
function renderShell(){
 document.getElementById("app").innerHTML=`<div class="min-h-screen flex">
 <aside id="side" class="fixed z-40 inset-y-0 left-0 w-64 bg-white border-r -translate-x-full lg:translate-x-0 transition-transform">
  <div class="h-20 px-5 flex items-center gap-3 border-b"><div class="w-11 h-11 rounded-xl bg-green-100 grid place-items-center text-2xl">🐄</div><div><b class="block">Gaushala</b><span class="text-xs text-slate-400">Management System</span></div></div>
  <div class="p-3 h-[calc(100vh-80px)] overflow-auto scrollbar space-y-1">${nav()}</div>
 </aside>
 <main class="lg:ml-64 min-h-screen w-full">
  <header class="sticky top-0 z-30 h-20 bg-white/95 backdrop-blur border-b px-4 lg:px-8 flex items-center justify-between">
   <div class="flex items-center gap-3"><button class="lg:hidden text-2xl" onclick="toggleSide()">☰</button><div><div class="text-xs text-slate-400">${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</div><h1 class="font-bold text-xl">${esc(state.page)}</h1></div></div>
   <div class="flex items-center gap-2"><div class="hidden md:flex items-center border rounded-xl px-3 bg-slate-50"><span>⌕</span><input class="bg-transparent outline-none p-2 w-56" placeholder="Search..." value="${esc(state.search)}" oninput="state.search=this.value;renderPage()"></div><select class="input !w-auto !py-2" onchange="state.role=this.value;renderShell()"><option>Owner / Admin</option><option>Manager</option><option>Veterinarian</option><option>Worker</option></select><div class="w-9 h-9 rounded-full bg-green-800 text-white grid place-items-center font-bold">A</div></div>
  </header>
  <section id="content" class="p-4 lg:p-8 max-w-[1600px] mx-auto"></section>
 </main></div>`;
 renderPage();
}
function go(p){state.page=p;state.search="";renderShell()}
function toggleSide(){document.getElementById("side").classList.toggle("-translate-x-full")}
async function loadAll(){
  await Promise.all(paths.map(p=>new Promise(res=>db.ref(p).on("value",s=>{state.data[p]=s.val()||{};res()}))));
  renderShell();
}
function stat(title,val,icon){return `<div class="card p-4"><div class="flex justify-between text-sm text-slate-500"><span>${title}</span><span class="w-8 h-8 rounded-lg bg-green-50 grid place-items-center">${icon}</span></div><b class="block text-2xl mt-3">${val}</b></div>`}
function pageHeader(title,desc,button=""){return `<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold">${title}</h2><p class="text-sm text-slate-500 mt-1">${desc}</p></div>${button}</div>`}
function dashboard(){
 const a=animals(), preg=a.filter(x=>x.pregnant||x.status==="Pregnant"), sick=a.filter(x=>["Sick","Emergency","Under Treatment"].includes(x.status)), lac=a.filter(x=>x.status==="Lactating"), calves=a.filter(x=>x.type==="Calf"), male=a.filter(x=>x.gender==="Male"), female=a.filter(x=>x.gender==="Female");
 const milk=list("milkRecords"), milkToday=milk.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.morning||0)+Number(x.evening||0),0);
 const due=preg.filter(x=>x.expectedCalvingDate&&daysTo(x.expectedCalvingDate)<=30&&daysTo(x.expectedCalvingDate)>=0);
 const overdue=preg.filter(x=>x.expectedCalvingDate&&daysTo(x.expectedCalvingDate)<0);
 return `<div>${pageHeader("Namaste 👋","Aaj ki gaushala ki important information ek jagah.",`<button class="btn btn-primary" onclick="openAnimal()">＋ Add Animal</button>`)}
 <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3 mb-5">
 ${stat("Total",a.length,"🐄")}${stat("Female",female.length,"♀")}${stat("Male",male.length,"♂")}${stat("Calves",calves.length,"🐮")}${stat("Pregnant",preg.length,"🤰")}${stat("Lactating",lac.length,"🥛")}${stat("Sick",sick.length,"⚠")}
 </div>
 <div class="grid lg:grid-cols-3 gap-5 mb-5">
  <div class="card p-5 lg:col-span-2"><h3 class="font-bold">Today's Snapshot</h3><div class="grid md:grid-cols-3 gap-3 mt-4">
   <div class="bg-slate-50 rounded-xl p-4"><span class="text-xs text-slate-500">Milk today</span><b class="block text-2xl mt-1">${milkToday.toFixed(1)} L</b></div>
   <div class="bg-slate-50 rounded-xl p-4"><span class="text-xs text-slate-500">Calving in 30 days</span><b class="block text-2xl mt-1">${due.length}</b></div>
   <div class="bg-slate-50 rounded-xl p-4"><span class="text-xs text-slate-500">Overdue calving</span><b class="block text-2xl mt-1 text-red-700">${overdue.length}</b></div>
  </div></div>
  <div class="card p-5"><h3 class="font-bold">Alerts</h3><div class="mt-3 space-y-2 text-sm">
   ${sick.length?`<div class="p-3 rounded-xl bg-red-50 text-red-800">⚠ ${sick.length} animal(s) need health attention.</div>`:"<div class='p-3 rounded-xl bg-green-50 text-green-800'>✓ No sick animals flagged.</div>"}
   ${due.length?`<div class="p-3 rounded-xl bg-violet-50 text-violet-800">🤰 ${due.length} pregnancy record(s) due within 30 days.</div>`:""}
   ${overdue.length?`<div class="p-3 rounded-xl bg-red-50 text-red-800">⏰ ${overdue.length} calving record(s) overdue.</div>`:""}
  </div></div>
 </div>
 <div class="card p-5"><div class="flex justify-between items-center mb-3"><div><h3 class="font-bold">Recent Animals</h3><p class="text-xs text-slate-400">Live from Firebase Realtime Database</p></div><button class="btn btn-soft" onclick="go('Animals')">View all →</button></div>${animalTable(a.slice(0,10))}</div>
 </div>`
}
function animalTable(arr){
 if(!arr.length)return `<div class="py-12 text-center text-slate-400">No animals found.</div>`;
 return `<div class="overflow-auto scrollbar"><table class="w-full text-sm"><thead><tr class="text-xs uppercase text-slate-400 border-b"><th class="text-left p-3">Animal</th><th class="text-left p-3">Gender</th><th class="text-left p-3">Type</th><th class="text-left p-3">Breed</th><th class="text-left p-3">Status</th><th class="text-left p-3">Shed</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr class="border-b last:border-0"><td class="p-3"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-green-50 grid place-items-center">${a.photo?`<img class="w-9 h-9 rounded-lg object-cover" src="${esc(a.photo)}">`:"🐄"}</div><div><b>${esc(a.id)}</b><span class="block text-xs text-slate-400">${esc(a.name||"Unnamed")}</span></div></div></td><td class="p-3">${esc(a.gender)}</td><td class="p-3">${esc(a.type)}</td><td class="p-3">${esc(a.breed||"—")}</td><td class="p-3">${badge(a.status)}</td><td class="p-3">${esc(a.shed||"—")}</td><td class="p-3 text-right"><button class="btn btn-soft !p-2" onclick="openAnimal('${esc(a.id)}')">Open</button></td></tr>`).join("")}</tbody></table></div>`
}
function animalsPage(){
 let a=animals(); if(state.search){let q=state.search.toLowerCase();a=a.filter(x=>`${x.id} ${x.name} ${x.breed} ${x.status} ${x.shed}`.toLowerCase().includes(q))}
 return pageHeader("Animal Registry","Har animal ka permanent profile, QR, health aur complete history.",`<button class="btn btn-primary" onclick="openAnimal()">＋ Add Animal</button>`)
 +`<div class="card p-5">${animalTable(a)}</div>`
}
function openAnimal(animalId=""){
 const a=findAnimal(animalId)||{id:"",name:"",gender:"Female",type:"Cow",breed:"",dob:"",shed:"",status:"Healthy",earTag:"",joinedDate:today(),notes:""};
 let upload=`<button type="button" class="btn btn-soft" onclick="cloudinaryUpload()">📷 Upload Photo</button><span id="photoStatus" class="text-xs text-slate-400 ml-2">${a.photo?"Photo uploaded":"Optional"}</span>`;
 modal(animalId?"Edit Animal":"Add Animal",formGrid(
  field("Animal ID","id",a.id,"text",animalId?"readonly":"")+
  field("Name / Nickname","name",a.name)+
  select("Gender","gender",["Female","Male"],a.gender)+
  select("Type","type",["Cow","Calf","Bull","Heifer","Other"],a.type)+
  field("Breed","breed",a.breed)+field("Date of Birth","dob",a.dob,"date")+
  field("Ear Tag","earTag",a.earTag)+field("Joined Gaushala","joinedDate",a.joinedDate,"date")+
  field("Shed / Location","shed",a.shed)+
  select("Status","status",["Healthy","Lactating","Pregnant","Dry","Sick","Under Treatment","Quarantine","Emergency"],a.status)+
  `<label class="md:col-span-2">Photo<div class="mt-1">${upload}</div></label>`+
  `<label class="md:col-span-2">Notes<textarea class="input mt-1" name="notes" rows="3">${esc(a.notes)}</textarea></label>`
 ),`<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAnimal('${animalId}')">Save Animal</button>`);
 window.currentPhoto=a.photo||"";
}
async function submitAnimal(existing){
 const f=document.querySelector("#modalRoot form"); 
 const root=document.getElementById("modalRoot"); const inputs=root.querySelectorAll("[name]");let d={};inputs.forEach(x=>d[x.name]=x.value);
 d.photo=window.currentPhoto||""; if(!d.id)d.id=id("COW");
 try{await save("animals",d.id,d);toast("Animal saved");closeModal()}catch(e){toast(e.message,false)}
}
function pregnancyPage(){
 let rows=list("pregnancies").sort((a,b)=>(a.expectedCalvingDate||"").localeCompare(b.expectedCalvingDate||""));
 return pageHeader("Pregnancy & Calving","Breeding date + 283 days se expected calving automatically calculate hota hai.",`<button class="btn btn-primary" onclick="openPregnancy()">＋ Record Pregnancy</button>`)
 +`<div class="grid md:grid-cols-3 gap-3 mb-5">${stat("Pregnant records",rows.length,"🤰")}${stat("Due ≤30 days",rows.filter(x=>daysTo(x.expectedCalvingDate)>=0&&daysTo(x.expectedCalvingDate)<=30).length,"📅")}${stat("Overdue",rows.filter(x=>daysTo(x.expectedCalvingDate)<0).length,"⏰")}</div><div class="card p-5 overflow-auto">${rows.length?`<table class="w-full text-sm"><thead><tr class="border-b text-xs text-slate-400 uppercase"><th class="p-3 text-left">Cow</th><th class="p-3 text-left">Breeding</th><th class="p-3 text-left">Expected</th><th class="p-3 text-left">Days</th><th class="p-3 text-left">Status</th></tr></thead><tbody>${rows.map(x=>{let d=daysTo(x.expectedCalvingDate);return `<tr class="border-b"><td class="p-3"><b>${esc(x.animalId)}</b><span class="block text-xs text-slate-400">${esc(findAnimal(x.animalId)?.name||"")}</span></td><td class="p-3">${fmt(x.breedingDate)}</td><td class="p-3 font-semibold">${fmt(x.expectedCalvingDate)}</td><td class="p-3">${d<0?`${Math.abs(d)} days overdue`:d===0?"Today":`${d} days`}</td><td class="p-3">${badge(d<0?"Overdue":d<=30?"Pregnant":"Tracked")}</td></tr>`}).join("")}</tbody></table>`:"<div class='py-12 text-center text-slate-400'>No pregnancy records yet.</div>"}</div>`
}
function openPregnancy(){
 const opts=animals().filter(a=>a.gender==="Female"&&a.type!=="Calf").map(a=>`<option value="${a.id}">${a.id} · ${a.name||"Unnamed"}</option>`).join("");
 modal("Record Pregnancy",formGrid(
  `<label class="block text-sm font-semibold text-slate-600">Cow<select class="input mt-1" name="animalId"><option value="">Select cow</option>${opts}</select></label>`+
  field("Breeding / AI Date","breedingDate",today(),"date")+
  select("Method","method",["AI","Natural mating"]) +
  `<div class="md:col-span-2 p-4 bg-green-50 rounded-xl"><span class="text-xs text-green-700">Expected calving date</span><b id="expected" class="block text-lg text-green-900 mt-1">Select breeding date</b><span class="text-xs text-green-700">Calculation: breeding date + 283 days</span></div>`
 ),`<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitPregnancy()">Save Pregnancy</button>`);
 document.querySelector('[name=breedingDate]').addEventListener("input",e=>document.getElementById("expected").textContent=fmt(addDays(e.target.value,283)));
}
async function submitPregnancy(){
 const r=document.getElementById("modalRoot");const animalId=r.querySelector('[name=animalId]').value, breedingDate=r.querySelector('[name=breedingDate]').value;
 if(!animalId||!breedingDate)return toast("Cow and breeding date required",false);
 const d={animalId,breedingDate,method:r.querySelector('[name=method]').value,expectedCalvingDate:addDays(breedingDate,283),confirmed:true};
 await save("pregnancies",id("PREG"),d); await db.ref("animals/"+animalId).update({pregnant:true,status:"Pregnant",expectedCalvingDate:d.expectedCalvingDate});
 toast("Pregnancy saved");closeModal();
}
function simplePage(type){
 const configs={
  Calves:["Calf Management","Birth, mother linkage, weight, growth and preventive care.","births","＋ Add Birth"],
  Health:["Health & Health Checks","Daily observation, sick alerts, treatment and follow-up.","healthChecks","＋ Health Check"],
  Medicines:["Medicines & Treatment","Medicine inventory, treatment history and expiry tracking.","medicines","＋ Medicine"],
  Vaccination:["Vaccination","Individual/group vaccination and next due dates.","vaccinations","＋ Vaccination"],
  Deworming:["Deworming","Configurable schedule; current 5-month interval can be used but remains editable.","deworming","＋ Deworming"],
  "Tick Control":["Tick / Chichdi Control","Spray records; current 4-month plan remains configurable.","tickControl","＋ Record Spray"],
  Feed:["Feed Management","Stock, daily usage, finish date and configurable feeding plans.","feedInventory","＋ Feed Item"],
  Sheds:["Sheds & Locations","Capacity, current animals, quarantine and movement history.","sheds","＋ Shed"],
  Workers:["Workers","Roles, assigned shed and access management.","workers","＋ Worker"],
  Tasks:["Daily Tasks","Assign feeding, cleaning, health and operational tasks.","tasks","＋ Task"],
  Expenses:["Expenses & Income","Feed, medicines, labour, utilities, donations and other finance.","expenses","＋ Expense"],
 };
 const c=configs[type];let rows=list(c[2]);if(state.search){let q=state.search.toLowerCase();rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q))}
 return pageHeader(c[0],c[1],`<button class="btn btn-primary" onclick="openRecord('${type}')">${c[3]}</button>`)
 +`<div class="card p-5"><div class="flex items-center justify-between mb-4"><span class="text-sm text-slate-500">${rows.length} records</span><input class="input !w-64" placeholder="Filter records" oninput="state.search=this.value;renderPage()"></div>${genericTable(type,rows)}</div>`
}
function genericTable(type,rows){
 if(!rows.length)return `<div class="py-14 text-center text-slate-400">No records yet. Add the first record.</div>`;
 let keys=Object.keys(rows[0]).filter(k=>!["id","updatedAt"].includes(k)).slice(0,6);
 return `<div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-xs uppercase text-slate-400">${keys.map(k=>`<th class="p-3 text-left">${esc(k.replace(/([A-Z])/g," $1"))}</th>`).join("")}<th></th></tr></thead><tbody>${rows.slice(0,100).map(x=>`<tr class="border-b">${keys.map(k=>`<td class="p-3">${k.toLowerCase().includes("date")?fmt(x[k]):k==="status"?badge(x[k]):esc(x[k])}</td>`).join("")}<td class="p-3 text-right"><button class="btn btn-danger !p-2" onclick="deleteRecord('${type}','${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`
}
const recordFields={
 Calves:[["animalId","Mother ID","text"],["birthDate","Birth Date","date"],["gender","Gender","select:Male|Female"],["birthWeight","Birth Weight (kg)","number"],["notes","Notes","text"]],
 Health:[["animalId","Animal ID","text"],["date","Date","date"],["status","Status","select:Normal|Watch|Sick|Emergency"],["temperature","Temperature","number"],["remarks","Remarks","text"]],
 Medicines:[["name","Medicine Name","text"],["batch","Batch Number","text"],["quantity","Quantity","number"],["unit","Unit","text"],["expiryDate","Expiry Date","date"],["minimumStock","Minimum Stock","number"]],
 Vaccination:[["animalId","Animal / Group","text"],["vaccine","Vaccine Name","text"],["date","Date","date"],["nextDueDate","Next Due Date","date"],["batch","Batch Number","text"],["remarks","Remarks","text"]],
 Deworming:[["animalId","Animal / Group","text"],["date","Date","date"],["medicine","Medicine","text"],["nextDueDate","Next Due Date","date"],["dose","Dose","text"],["remarks","Remarks","text"]],
 "Tick Control":[["animalId","Animal / Group","text"],["date","Date","date"],["product","Product","text"],["nextDueDate","Next Due Date","date"],["dose","Dose / Concentration","text"],["remarks","Remarks","text"]],
 Feed:[["name","Feed Item","text"],["unit","Unit","text"],["openingStock","Opening Stock","number"],["purchase","Purchase","number"],["dailyUsage","Daily Usage","number"],["minimumStock","Minimum Stock","number"],["cost","Cost","number"]],
 Sheds:[["name","Shed Name","text"],["capacity","Capacity","number"],["responsibleWorker","Responsible Worker","text"],["notes","Notes","text"]],
 Workers:[["name","Name","text"],["phone","Phone","text"],["role","Role","select:Worker|Manager|Veterinarian"],["shed","Assigned Shed","text"],["joiningDate","Joining Date","date"]],
 Tasks:[["title","Task","text"],["assignedTo","Assigned Worker","text"],["date","Date","date"],["priority","Priority","select:Low|Normal|High|Urgent"],["status","Status","select:Pending|In Progress|Completed|Skipped"],["notes","Notes","text"]],
 Expenses:[["date","Date","date"],["category","Category","select:Green fodder|Dry fodder|Concentrate|Medicine|Veterinary|Labour|Electricity|Water|Repair|Transport|Equipment|Other"],["amount","Amount","number"],["vendor","Vendor","text"],["paymentMethod","Payment Method","select:Cash|UPI|Bank|Other"],["notes","Notes","text"]]
};
function openRecord(type){
 const fields=recordFields[type];let html=formGrid(fields.map(([n,l,t])=>t.startsWith("select:")?select(l,n,t.slice(7).split("|")):field(l,n,n.toLowerCase().includes("date")?today():"",t)).join(""));
 modal(`Add ${type} Record`,html,`<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitRecord('${type}')">Save Record</button>`);
}
async function submitRecord(type){
 const map={Calves:"births",Health:"healthChecks",Medicines:"medicines",Vaccination:"vaccinations",Deworming:"deworming","Tick Control":"tickControl",Feed:"feedInventory",Sheds:"sheds",Workers:"workers",Tasks:"tasks",Expenses:"expenses"};
 let d={};document.querySelectorAll("#modalRoot [name]").forEach(x=>d[x.name]=x.value);d.createdAt=new Date().toISOString();
 if(type==="Health" && ["Sick","Emergency"].includes(d.status)){let a=findAnimal(d.animalId);if(a)await db.ref("animals/"+a.id).update({status:d.status})}
 await save(map[type],id(type.toUpperCase().replace(/ /g,"")),d);toast(`${type} record saved`);closeModal();
}
async function deleteRecord(type,key){
 if(!confirm("Delete this record?"))return;
 const map={Calves:"births",Health:"healthChecks",Medicines:"medicines",Vaccination:"vaccinations",Deworming:"deworming","Tick Control":"tickControl",Feed:"feedInventory",Sheds:"sheds",Workers:"workers",Tasks:"tasks",Expenses:"expenses"};
 await remove(map[type],key);toast("Deleted");
}
function milkPage(){
 const rows=list("milkRecords").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 return pageHeader("Milk Production","Morning + evening milk records, daily totals and cow-wise history.",`<button class="btn btn-primary" onclick="openRecord('Milk')">＋ Record Milk</button>`)
 +`<div class="grid md:grid-cols-3 gap-3 mb-5">${stat("Today's milk",rows.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.morning||0)+Number(x.evening||0),0).toFixed(1)+" L","🥛")}${stat("Milk records",rows.length,"📝")}${stat("Lactating",animals().filter(x=>x.status==="Lactating").length,"🐄")}</div><div class="card p-5">${genericTable("Milk",rows)}</div>`
}
function reportsPage(){
 const a=animals(), exp=list("expenses").reduce((s,x)=>s+Number(x.amount||0),0), milk=list("milkRecords").reduce((s,x)=>s+Number(x.morning||0)+Number(x.evening||0),0);
 return pageHeader("Reports","Quick operational summary. Export-ready data remains in Firebase.",`<button class="btn btn-soft" onclick="exportAnimals()">↓ Export Animals CSV</button>`)
 +`<div class="grid md:grid-cols-3 gap-4 mb-5">${stat("Animals",a.length,"🐄")}${stat("Total milk records",milk.toFixed(1)+" L","🥛")}${stat("Expenses recorded","₹"+exp.toLocaleString("en-IN"),"₹")}</div>
 <div class="card p-5"><h3 class="font-bold">Monthly / operational reports</h3><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">${["Animal Master","Pregnancy & Calving","Milk Production","Feed Consumption","Medical Treatment","Vaccination","Deworming","Tick Control","Sick Animals","Mortality","Worker Tasks","Expenses"].map(x=>`<button class="btn btn-soft justify-start" onclick="toast('Use Firebase data + Export for ${x}')">📄 ${x}</button>`).join("")}</div></div>`
}
function settingsPage(){
 return pageHeader("Settings","Configure Cloudinary photo uploads and operational preferences.")
 +`<div class="grid lg:grid-cols-2 gap-5"><div class="card p-5"><h3 class="font-bold mb-4">Cloudinary</h3>${field("Cloud Name","cloudName",state.cloud.name)}${field("Unsigned Upload Preset","cloudPreset",state.cloud.preset)}<p class="text-xs text-slate-400 mt-3">Never put your Cloudinary API secret in browser code. Use an unsigned upload preset.</p><button class="btn btn-primary mt-4" onclick="saveCloudSettings()">Save Cloudinary Settings</button></div>
 <div class="card p-5"><h3 class="font-bold mb-4">Preventive schedules</h3>${field("Deworming interval (days)","dewormDays",localStorage.dewormDays||"150","number")}${field("Tick control interval (days)","tickDays",localStorage.tickDays||"120","number")}<button class="btn btn-primary mt-4" onclick="localStorage.dewormDays=document.querySelector('[name=dewormDays]').value;localStorage.tickDays=document.querySelector('[name=tickDays]').value;toast('Schedule settings saved')">Save Schedules</button></div></div>`
}
function renderPage(){
 const c=document.getElementById("content");if(!c)return;
 let html=state.page==="Dashboard"?dashboard():state.page==="Animals"?animalsPage():state.page==="Pregnancy"?pregnancyPage():state.page==="Milk"?milkPage():state.page==="Reports"?reportsPage():state.page==="Settings"?settingsPage():simplePage(state.page);
 c.innerHTML=html;
}
function saveCloudSettings(){state.cloud.name=document.querySelector('[name=cloudName]').value;state.cloud.preset=document.querySelector('[name=cloudPreset]').value;localStorage.cloudinaryName=state.cloud.name;localStorage.cloudinaryPreset=state.cloud.preset;toast("Cloudinary settings saved")}
function cloudinaryUpload(){
 if(!state.cloud.name||!state.cloud.preset){toast("Settings me Cloudinary Cloud Name aur Unsigned Preset add karein",false);return}
 cloudinary.openUploadWidget({cloudName:state.cloud.name,uploadPreset:state.cloud.preset,sources:["local","camera"],multiple:false,folder:"gaushala/animals",clientAllowedFormats:["jpg","jpeg","png","webp"],maxFileSize:5000000},(err,res)=>{
   if(!err&&res&&res.event==="success"){window.currentPhoto=res.info.secure_url;document.getElementById("photoStatus").textContent="Photo ready ✓";toast("Photo uploaded")}
 });
}
function exportAnimals(){
 const rows=animals(), keys=["id","name","gender","type","breed","dob","earTag","shed","status","joinedDate"];
 const csv=[keys.join(","),...rows.map(a=>keys.map(k=>`"${String(a[k]??"").replaceAll('"','""')}"`).join(","))].join("\\n");
 const blob=new Blob([csv],{type:"text/csv"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="gaushala-animals.csv";a.click();URL.revokeObjectURL(url);
}
window.go=go;window.toggleSide=toggleSide;window.openAnimal=openAnimal;window.openPregnancy=openPregnancy;window.closeModal=closeModal;window.submitAnimal=submitAnimal;window.submitPregnancy=submitPregnancy;window.openRecord=openRecord;window.submitRecord=submitRecord;window.deleteRecord=deleteRecord;window.cloudinaryUpload=cloudinaryUpload;window.saveCloudSettings=saveCloudSettings;window.exportAnimals=exportAnimals;window.state=state;window.renderPage=renderPage;

auth.signInAnonymously().catch(e=>console.warn("Anonymous Auth is not enabled; configure Firebase Auth or use your own login.",e.message));
loadAll().catch(e=>{document.getElementById("app").innerHTML=`<div class="p-10 max-w-2xl mx-auto"><div class="card p-6"><h1 class="text-xl font-bold text-red-700">Firebase connection error</h1><p class="mt-2 text-slate-600">${esc(e.message)}</p><p class="mt-3 text-sm text-slate-500">Check Realtime Database rules and enable Anonymous Authentication if using this starter.</p></div></div>`});
</script>
