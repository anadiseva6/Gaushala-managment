<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#14532d"/>
  <title>Gaushala Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{brand:{50:"#f0fdf4",100:"#dcfce7",600:"#16a34a",700:"#15803d",800:"#166534",900:"#14532d"}}}}}
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body{background:#f6f8f6}.scrollbar::-webkit-scrollbar{width:7px;height:7px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5ce;border-radius:20px}
    .nav-active{background:#dcfce7;color:#14532d;font-weight:700}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 8px rgba(16,24,16,.035)}
    .input{width:100%;border:1px solid #d7ded9;border-radius:10px;padding:.62rem .75rem;outline:none;background:white}.input:focus{border-color:#65a30d;box-shadow:0 0 0 3px #ecfccb}
    .btn{border-radius:10px;padding:.62rem .9rem;font-weight:700;display:inline-flex;align-items:center;gap:.45rem;cursor:pointer;border:none}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-primary{background:#166534;color:white}.btn-primary:hover{background:#14532d}.btn-soft{background:#eef5ef;color:#245234}.btn-soft:hover{background:#e1ede2}.btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
    .badge{font-size:.72rem;font-weight:700;border-radius:999px;padding:.25rem .55rem;display:inline-block}.toast{animation:in .2s ease}@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    .modal-bg{background:rgba(4,15,8,.48)}.hide-scroll::-webkit-scrollbar{display:none}
    .spinner{width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
    details.info summary{list-style:none;cursor:pointer}details.info summary::-webkit-details-marker{display:none}details.info summary::marker{content:""}
    details.info[open] summary{background:#cbd5ce}
  </style>
</head>
<body class="text-slate-800">
<div id="app"></div>
<div id="toast" class="fixed bottom-5 right-5 z-[100]"></div>
<div id="modalRoot"></div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyB4SZAFtG5FGdXkfWaKhvaw6r7UFfmcekw",
  authDomain:"gaushala-managment.firebaseapp.com",
  databaseURL:"https://gaushala-managment-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gaushala-managment",
  storageBucket:"gaushala-managment.firebasestorage.app",
  messagingSenderId:"204886706588",
  appId:"1:204886706588:web:102c6b87a40771c85a2059",
  measurementId:"G-72D440YMX5"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), auth=firebase.auth();

const state={
  page:"Dashboard", data:{}, search:"", modal:null, role:localStorage.gaushalaRole||"Owner / Admin",
  cloud:{name:localStorage.cloudinaryName||"lw7coppb",preset:localStorage.cloudinaryPreset||"gaushala_images"}
};
const modules={
  Dashboard:["🏠","Dashboard"], Animals:["🐄","Animals"], Pregnancy:["🤰","Pregnancy"], Calves:["🐮","Calves"],
  Milk:["🥛","Milk"], Feed:["🌾","Feed"], Health:["❤️","Health"], Medicines:["💊","Medicines"],
  Vaccination:["💉","Vaccination"], Deworming:["🛡️","Deworming"], "Tick Control":["🪲","Tick Control"],
  Sheds:["🏠","Sheds"], Workers:["👷","Workers"], Tasks:["☑️","Tasks"], Expenses:["₹","Expenses"], Reports:["📊","Reports"], Settings:["⚙️","Settings"]
};
// Role-based access: null = full access. hiddenModules = module poori tarah nazar nahi aayega.
// viewOnly = module dikhega par Add/Edit/Delete button hidden rahenge, sirf data dekh sakte hain.
const ROLE_PERMISSIONS={
 "Owner / Admin":null,
 "Manager":{hiddenModules:["Settings"],viewOnly:[]},
 "Veterinarian":{hiddenModules:["Workers","Expenses","Sheds","Settings"],viewOnly:["Animals"]},
 "Worker":{hiddenModules:["Pregnancy","Medicines","Vaccination","Deworming","Tick Control","Sheds","Workers","Expenses","Reports","Settings"],viewOnly:["Animals"]}
};
const ROLE_DESCRIPTIONS={
 "Owner / Admin":"Sab kuch dekh aur badal sakte hain — full access, Settings bhi.",
 "Manager":"Settings ke alawa har module ka full access — animals, milk, feed, health, expenses sab manage kar sakte hain.",
 "Veterinarian":"Medical modules (Health, Medicines, Vaccination, Deworming, Tick Control, Pregnancy) full access. Workers, Expenses, Sheds aur Settings dikhenge hi nahi. Animal list sirf dekh sakte hain, edit nahi.",
 "Worker":"Sirf roz ke operational kaam — Tasks, Milk, Feed, Calves, basic Health. Animal list sirf dekh sakte hain. Pregnancy, Medicines, Workers, Expenses, Reports, Settings nahi dikhenge."
};
function currentPermissions(){return ROLE_PERMISSIONS[state.role]||null}
function isModuleHidden(m){const p=currentPermissions();return !!(p&&p.hiddenModules&&p.hiddenModules.includes(m))}
function isModuleViewOnly(m){const p=currentPermissions();return !!(p&&p.viewOnly&&p.viewOnly.includes(m))}
function changeRole(r){
 state.role=r;localStorage.gaushalaRole=r;
 if(isModuleHidden(state.page)){toast(`${state.role} role ke paas ${state.page} ka access nahi hai`,false);state.page="Dashboard"}
 renderShell();
}
function infoIcon(text){
 return `<details class="info relative inline-block align-middle ml-2"><summary class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 text-[11px] font-bold grid place-items-center hover:bg-slate-300" title="${esc(text)}">i</summary><div class="absolute z-20 left-0 mt-2 w-72 max-w-[80vw] card p-3 text-xs text-slate-600 shadow-lg font-normal">${esc(text)}</div></details>`
}
const paths=["animals","pregnancies","calvings","milkRecords","healthChecks","treatments","medicines","vaccinations","deworming","tickControl","feedInventory","feedRecords","sheds","workers","tasks","expenses","income","quarantine","movements","births","notifications","mediaLog"];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function id(prefix){return prefix+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function fmt(d){if(!d)return"—";return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function fmtBytes(n){n=Number(n||0);if(n<1024)return n+" B";if(n<1024*1024)return (n/1024).toFixed(1)+" KB";return (n/(1024*1024)).toFixed(2)+" MB"}
function badge(s){
  let c="bg-slate-100 text-slate-700"; if(["Healthy","Completed","Lactating"].includes(s))c="bg-green-100 text-green-800";
  if(["Pregnant","Under Treatment"].includes(s))c="bg-violet-100 text-violet-800"; if(["Sick","Emergency","Overdue"].includes(s))c="bg-red-100 text-red-800";
  if(["Pending","Quarantine","Dry"].includes(s))c="bg-amber-100 text-amber-800"; return `<span class="badge ${c}">${esc(s||"—")}</span>`
}
function toast(msg,ok=true){document.getElementById("toast").innerHTML=`<div class="toast card px-4 py-3 flex items-center gap-2 ${ok?"text-green-800":"text-red-800"}">${ok?"✓":"⚠"} ${esc(msg)}</div>`;setTimeout(()=>document.getElementById("toast").innerHTML="",3000)}
async function save(path,key,data){if(!key)key=id(path.slice(0,-1).toUpperCase()||"REC");data.updatedAt=new Date().toISOString();await db.ref(`${path}/${key}`).set({...data,id:key});return key}
async function remove(path,key){if(!path){toast("Could not delete: unknown record type",false);return}await db.ref(`${path}/${key}`).remove()}
function list(path){return Object.values(state.data[path]||{})}
function animals(){return list("animals")}
function findAnimal(id){return animals().find(a=>a.id===id)}
function modal(title,body,actions=""){document.getElementById("modalRoot").innerHTML=`<div class="modal-bg fixed inset-0 z-50 p-4 flex items-center justify-center"><div class="bg-white rounded-2xl w-full max-w-3xl max-h-[92vh] overflow-auto scrollbar"><div class="p-5 border-b flex justify-between items-center"><h3 class="font-bold text-lg">${title}</h3><button onclick="closeModal()" class="text-2xl text-slate-400">×</button></div><div class="p-5">${body}</div>${actions?`<div class="p-5 border-t flex justify-end gap-2">${actions}</div>`:""}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function field(label,name,value="",type="text",extra=""){return `<label class="block text-sm font-semibold text-slate-600">${label}<input ${extra} class="input mt-1" name="${name}" type="${type}" value="${esc(value)}"></label>`}
function select(label,name,opts,value=""){return `<label class="block text-sm font-semibold text-slate-600">${label}<select class="input mt-1" name="${name}">${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
function formGrid(html){return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${html}</div>`}
function animalDatalist(){return `<datalist id="animalIds">${animals().map(a=>`<option value="${esc(a.id)}">${esc(a.name||"")}</option>`).join("")}</datalist>`}
function nav(){
  return Object.entries(modules).filter(([k])=>!isModuleHidden(k)).map(([k,[i,l]])=>`<button onclick="go('${k}')" class="w-full text-left px-3 py-2.5 rounded-xl flex gap-3 items-center ${state.page===k?"nav-active":"text-slate-500 hover:bg-slate-100"}">${i}<span>${l}</span></button>`).join("")
}
function renderShell(){
 document.getElementById("app").innerHTML=`<div class="min-h-screen flex">
 <aside id="side" class="fixed z-40 inset-y-0 left-0 w-64 bg-white border-r -translate-x-full lg:translate-x-0 transition-transform">
  <div class="h-20 px-5 flex items-center gap-3 border-b"><div class="w-11 h-11 rounded-xl bg-green-100 grid place-items-center text-2xl">🐄</div><div><b class="block">Gaushala</b><span class="text-xs text-slate-400">Management System</span></div></div>
  <div class="p-3 h-[calc(100vh-80px)] overflow-auto scrollbar space-y-1">${nav()}</div>
 </aside>
 <main class="lg:ml-64 min-h-screen w-full">
  <header class="sticky top-0 z-30 h-20 bg-white/95 backdrop-blur border-b px-4 lg:px-8 flex items-center justify-between">
   <div class="flex items-center gap-3"><button class="lg:hidden text-2xl" onclick="toggleSide()">☰</button><div><div class="text-xs text-slate-400">${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</div><h1 class="font-bold text-xl">${esc(state.page)}</h1></div></div>
   <div class="flex items-center gap-2"><div class="hidden md:flex items-center border rounded-xl px-3 bg-slate-50"><span>⌕</span><input class="bg-transparent outline-none p-2 w-56" placeholder="Search..." value="${esc(state.search)}" oninput="state.search=this.value;renderPage()"></div><div class="flex items-center">${infoIcon("Role change karne se app ke features us role ke hisaab se badal jaate hain — kuch modules chhup jaate hain ya sirf-dekhne-layak ban jaate hain. Details: "+Object.entries(ROLE_DESCRIPTIONS).map(([r,d])=>r+" — "+d).join("  |  "))}<select class="input !w-auto !py-2 ml-1" onchange="changeRole(this.value)">${["Owner / Admin","Manager","Veterinarian","Worker"].map(r=>`<option ${r===state.role?"selected":""}>${esc(r)}</option>`).join("")}</select></div><div class="w-9 h-9 rounded-full bg-green-800 text-white grid place-items-center font-bold">A</div></div>
  </header>
  <section id="content" class="p-4 lg:p-8 max-w-[1600px] mx-auto"></section>
 </main></div>`;
 renderPage();
}
function go(p){
 if(isModuleHidden(p)){toast(`${state.role} role ke paas ${p} ka access nahi hai`,false);return}
 state.page=p;state.search="";renderShell()
}
function toggleSide(){document.getElementById("side").classList.toggle("-translate-x-full")}
async function loadAll(){
  await Promise.all(paths.map(p=>new Promise(res=>{
   let firstSnapshot=true;
   db.ref(p).on("value",s=>{
    state.data[p]=s.val()||{};
    if(firstSnapshot){firstSnapshot=false;res();}
    else if(document.getElementById("content")){renderPage();}
   },err=>{console.error(p,err);if(firstSnapshot){firstSnapshot=false;res()}});
  })));
  renderShell();
}
function stat(title,val,icon){return `<div class="card p-4"><div class="flex justify-between text-sm text-slate-500"><span>${title}</span><span class="w-8 h-8 rounded-lg bg-green-50 grid place-items-center">${icon}</span></div><b class="block text-2xl mt-3">${val}</b></div>`}
function pageHeader(title,desc,button="",help=""){return `<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold flex items-center">${title}${help?infoIcon(help):""}</h2><p class="text-sm text-slate-500 mt-1">${desc}</p></div>${button}</div>`}
function dashboard(){
 const a=animals(), preg=a.filter(x=>x.pregnant||x.status==="Pregnant"), sick=a.filter(x=>["Sick","Emergency","Under Treatment"].includes(x.status)), lac=a.filter(x=>x.status==="Lactating"), calves=a.filter(x=>x.type==="Calf"), male=a.filter(x=>x.gender==="Male"), female=a.filter(x=>x.gender==="Female");
 const milk=list("milkRecords"), milkToday=milk.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.morning||0)+Number(x.evening||0),0);
 const due=preg.filter(x=>x.expectedCalvingDate&&daysTo(x.expectedCalvingDate)<=30&&daysTo(x.expectedCalvingDate)>=0);
 const overdue=preg.filter(x=>x.expectedCalvingDate&&daysTo(x.expectedCalvingDate)<0);
 return `<div>${pageHeader("Namaste 👋","Aaj ki gaushala ki important information ek jagah.",isModuleViewOnly("Animals")?"":`<button class="btn btn-primary" onclick="openAnimal()">＋ Add Animal</button>`,"Yahan gaushala ka overall summary dikhta hai — kitne animals hain, aaj kitna doodh nikla, kaunsi cow pregnant ya sick hai. Roz subah sabse pehle yahi dekhein.")}
 <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3 mb-5">
 ${stat("Total",a.length,"🐄")}${stat("Female",female.length,"♀")}${stat("Male",male.length,"♂")}${stat("Calves",calves.length,"🐮")}${stat("Pregnant",preg.length,"🤰")}${stat("Lactating",lac.length,"🥛")}${stat("Sick",sick.length,"⚠")}
 </div>
 <div class="grid lg:grid-cols-3 gap-5 mb-5">
  <div class="card p-5 lg:col-span-2"><h3 class="font-bold">Today's Snapshot</h3><div class="grid md:grid-cols-3 gap-3 mt-4">
   <div class="bg-slate-50 rounded-xl p-4"><span class="text-xs text-slate-500">Milk today</span><b class="block text-2xl mt-1">${milkToday.toFixed(1)} L</b></div>
   <div class="bg-slate-50 rounded-xl p-4"><span class="text-xs text-slate-500">Calving in 30 days</span><b class="block text-2xl mt-1">${due.length}</b></div>
   <div class="bg-slate-50 rounded-xl p-4"><span class="text-xs text-slate-500">Overdue calving</span><b class="block text-2xl mt-1 text-red-700">${overdue.length}</b></div>
  </div></div>
  <div class="card p-5"><h3 class="font-bold">Alerts</h3><div class="mt-3 space-y-2 text-sm">
   ${sick.length?`<div class="p-3 rounded-xl bg-red-50 text-red-800">⚠ ${sick.length} animal(s) need health attention.</div>`:"<div class='p-3 rounded-xl bg-green-50 text-green-800'>✓ No sick animals flagged.</div>"}
   ${due.length?`<div class="p-3 rounded-xl bg-violet-50 text-violet-800">🤰 ${due.length} pregnancy record(s) due within 30 days.</div>`:""}
   ${overdue.length?`<div class="p-3 rounded-xl bg-red-50 text-red-800">⏰ ${overdue.length} calving record(s) overdue.</div>`:""}
  </div></div>
 </div>
 <div class="card p-5"><div class="flex justify-between items-center mb-3"><div><h3 class="font-bold">Recent Animals</h3><p class="text-xs text-slate-400">Live from Firebase Realtime Database</p></div><button class="btn btn-soft" onclick="go('Animals')">View all →</button></div>${animalTable(a.slice(0,10))}</div>
 </div>`
}
function animalTable(arr){
 if(!arr.length)return `<div class="py-12 text-center text-slate-400">No animals found.</div>`;
 const viewOnly=isModuleViewOnly("Animals");
 return `<div class="overflow-auto scrollbar"><table class="w-full text-sm"><thead><tr class="text-xs uppercase text-slate-400 border-b"><th class="text-left p-3">Animal</th><th class="text-left p-3">Gender</th><th class="text-left p-3">Type</th><th class="text-left p-3">Breed</th><th class="text-left p-3">Status</th><th class="text-left p-3">Shed</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr class="border-b last:border-0"><td class="p-3"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-green-50 grid place-items-center overflow-hidden">${a.photo?`<img class="w-9 h-9 rounded-lg object-cover" src="${esc(a.photo)}">`:"🐄"}</div><div><b>${esc(a.id)}</b><span class="block text-xs text-slate-400">${esc(a.name||"Unnamed")}</span></div></div></td><td class="p-3">${esc(a.gender)}</td><td class="p-3">${esc(a.type)}</td><td class="p-3">${esc(a.breed||"—")}</td><td class="p-3">${badge(a.status)}</td><td class="p-3">${esc(a.shed||"—")}</td><td class="p-3 text-right">${viewOnly?`<span class="text-xs text-slate-400">View only</span>`:`<button class="btn btn-soft !p-2" onclick="openAnimal('${esc(a.id)}')">Open</button>`}</td></tr>`).join("")}</tbody></table></div>`
}
function animalsPage(){
 let a=animals(); if(state.search){let q=state.search.toLowerCase();a=a.filter(x=>`${x.id} ${x.name} ${x.breed} ${x.status} ${x.shed}`.toLowerCase().includes(q))}
 return pageHeader("Animal Registry","Har animal ka permanent profile, QR, health aur complete history.",isModuleViewOnly("Animals")?"":`<button class="btn btn-primary" onclick="openAnimal()">＋ Add Animal</button>`,"Har cow/bull/calf ka permanent record yahan banta hai — naam, breed, status, shed. Naya animal aane par yahin add karein, kisi bhi animal ka poora profile dekhne ke liye 'Open' dabayein.")
 +`<div class="card p-5">${animalTable(a)}</div>`
}
function openAnimal(animalId=""){
 if(isModuleViewOnly("Animals")){toast(`${state.role} role sirf Animals dekh sakta hai, edit nahi`,false);return}
 const a=findAnimal(animalId)||{id:"",name:"",gender:"Female",type:"Cow",breed:"",dob:"",shed:"",status:"Healthy",earTag:"",joinedDate:today(),notes:""};
 window.currentPhoto=a.photo||"";
 let upload=`<input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoSelected(event)">
  <div class="flex flex-wrap gap-2">
   <button type="button" class="btn btn-soft" onclick="triggerPhotoInput('camera')">📷 Take Photo</button>
   <button type="button" class="btn btn-soft" onclick="triggerPhotoInput('gallery')">🖼️ Choose Photo</button>
  </div>
  <span id="photoStatus" class="text-xs text-slate-400 block mt-2">${a.photo?"Photo already saved. Uploading a new one will replace it.":"Photos are auto-compressed before upload to save storage."}</span>
  <div id="photoPreviewWrap">${a.photo?`<img id="photoPreview" src="${esc(a.photo)}" class="mt-2 w-20 h-20 object-cover rounded-lg border">`:""}</div>`;
 modal(animalId?"Edit Animal":"Add Animal",formGrid(
  field("Animal ID","id",a.id,"text",animalId?"readonly":"")+
  field("Name / Nickname","name",a.name)+
  select("Gender","gender",["Female","Male"],a.gender)+
  select("Type","type",["Cow","Calf","Bull","Heifer","Other"],a.type)+
  field("Breed","breed",a.breed)+field("Date of Birth","dob",a.dob,"date")+
  field("Ear Tag","earTag",a.earTag)+field("Joined Gaushala","joinedDate",a.joinedDate,"date")+
  field("Shed / Location","shed",a.shed)+
  select("Status","status",["Healthy","Lactating","Pregnant","Dry","Sick","Under Treatment","Quarantine","Emergency"],a.status)+
  `<label class="md:col-span-2">Photo<div class="mt-1">${upload}</div></label>`+
  `<label class="md:col-span-2">Notes<textarea class="input mt-1" name="notes" rows="3">${esc(a.notes)}</textarea></label>`
 ),`<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAnimal('${animalId}')">Save Animal</button>`);
}
async function submitAnimal(existing){
 const root=document.getElementById("modalRoot"); const inputs=root.querySelectorAll("[name]");let d={};inputs.forEach(x=>d[x.name]=x.value);
 if(!d.id){toast("Animal ID is required",false);return}
 if(!existing && findAnimal(d.id)){toast("This Animal ID already exists",false);return}
 d.photo=window.currentPhoto||""; if(!d.id)d.id=id("COW");
 try{await save("animals",d.id,d);toast("Animal saved");closeModal()}catch(e){toast(e.message,false)}
}
function pregnancyPage(){
 let rows=list("pregnancies").sort((a,b)=>(a.expectedCalvingDate||"").localeCompare(b.expectedCalvingDate||""));
 return pageHeader("Pregnancy & Calving","Breeding date + 283 days se expected calving automatically calculate hota hai.",`<button class="btn btn-primary" onclick="openPregnancy()">＋ Record Pregnancy</button>`,"Jab cow ko AI ya natural mating karayi jaaye, uski breeding date yahan daalein — app khud expected calving date nikaal degi (283 din baad) aur cow ka status 'Pregnant' ho jayega.")

function openRecord(type,key){

async function submitRecord(type,key){

 if(!fields||!path){toast(`Unknown record type: ${type}`,false);return}
 let d={};document.querySelectorAll("#modalRoot [name]").forEach(x=>d[x.name]=x.value);
 const [requiredName,requiredLabel]=fields[0];
 if(!d[requiredName]){toast(`${requiredLabel} is required`,false);return}
 if(!key)d.createdAt=new Date().toISOString();
 try{
  if(type==="Health"&&["Sick","Emergency"].includes(d.status)){let a=findAnimal(d.animalId);if(a)await db.ref("animals/"+a.id).update({status:d.status})}
  await save(path,key||id(type.toUpperCase().replace(/ /g,"")),d);
  toast(`${type} record saved`);closeModal();
 }catch(e){toast(e.message,false)}
}

// ---- Photo capture + compression + Cloudinary upload ----
function compressImage(file,maxDim=1280,quality=0.72){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Could not read the selected file"));
  reader.onload=e=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("That file doesn't look like a valid image"));
   img.onload=()=>{
    let {width,height}=img;
    if(width>height&&width>maxDim){height=Math.round(height*maxDim/width);width=maxDim}
    else if(height>=width&&height>maxDim){width=Math.round(width*maxDim/height);height=maxDim}
    const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,width,height);
    canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Image compression failed")),"image/jpeg",quality);
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}
function triggerPhotoInput(mode){

async function handlePhotoSelected(e){
 const file=e.target.files&&e.target.files[0];
 e.target.value="";
 if(!file)return;
 if(!state.cloud.name||!state.cloud.preset){toast("Add your Cloudinary Cloud Name and Upload Preset in Settings first",false);return}
 const statusEl=document.getElementById("photoStatus");
 try{
  if(statusEl)statusEl.innerHTML=`<span class="spinner border-slate-400"></span> Compressing image...`;
  const originalKb=(file.size/1024).toFixed(0);
  const blob=await compressImage(file);
  if(statusEl)statusEl.innerHTML=`<span class="spinner border-slate-400"></span> Uploading (${fmtBytes(blob.size)}, was ${originalKb} KB)...`;
  const fd=new FormData();
  fd.append("file",blob,"photo.jpg");
  fd.append("upload_preset",state.cloud.preset);
  fd.append("folder","gaushala/animals");
  const res=await fetch(`https://api.cloudinary.com/v1_1/${state.cloud.name}/image/upload`,{method:"POST",body:fd});
  const data=await res.json();
  if(!res.ok)throw new Error(data?.error?.message||"Cloudinary upload failed");
  window.currentPhoto=data.secure_url;
  if(statusEl)statusEl.textContent=`Uploaded ✓ (${fmtBytes(blob.size)}, compressed from ${originalKb} KB)`;
  const wrap=document.getElementById("photoPreviewWrap");
  if(wrap)wrap.innerHTML=`<img id="photoPreview" src="${esc(data.secure_url)}" class="mt-2 w-20 h-20 object-cover rounded-lg border">`;
  toast("Photo uploaded");
  await db.ref("mediaLog/"+id("MED")).set({publicId:data.public_id,url:data.secure_url,bytes:blob.size,createdAt:new Date().toISOString()});
 }catch(err){
  if(statusEl)statusEl.textContent="Upload failed — try again";
  toast(err.message,false);
 }
}
