const paths=["animals","pregnancies","calvings","milkRecords","healthChecks","treatments","medicines","vaccinations","deworming","tickControl","nailCutting","feedInventory","feedRecords","sheds","workers","tasks","expenses","income","quarantine","movements","births","notifications","mediaLog"];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function id(prefix){return prefix+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function fmt(d){if(!d)return"—";return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function fmtBytes(n){n=Number(n||0);if(n<1024)return n+" B";if(n<1024*1024)return (n/1024).toFixed(1)+" KB";return (n/(1024*1024)).toFixed(2)+" MB"}
function badge(s){

}

function animalDatalist(){return `<datalist id="animalIds">${animals().map(a=>`<option value="${esc(a.id)}">${esc(a.name||"")}</option>`).join("")}</datalist>`}
// Walks up the mother chain starting at startId, looking for targetId. Used to block
// self-references and circular blood lines (an animal can't be its own ancestor).
function motherChainIncludes(startId,targetId,guard){
 guard=guard||0;
 if(!startId||guard>25)return false;
 if(startId===targetId)return true;
 const a=findAnimal(startId);
 if(!a||!a.motherId)return false;
 return motherChainIncludes(a.motherId,targetId,guard+1);
}
// Number of mother-hops walking up from fromId until targetId is found (0 if same animal),
// or -1 if targetId isn't in fromId's mother chain. Used to label relations (Mother,
// Grandmother, Child, Grandchild...) relative to whichever animal is selected.
function chainDistance(fromId,toId,guard){
 guard=guard||0;
 if(!fromId||guard>30)return -1;
 if(fromId===toId)return 0;
 const a=findAnimal(fromId);
 if(!a||!a.motherId)return -1;
 const d=chainDistance(a.motherId,toId,guard+1);
 return d===-1?-1:d+1;
}
const ANCESTOR_LABELS=["","Mother","Grandmother","Great-grandmother"];
const DESCENDANT_LABELS=["","Child","Grandchild","Great-grandchild"];
function relationLabel(nodeId,selectedId){
 if(nodeId===selectedId)return "";
 let d=chainDistance(selectedId,nodeId);
 if(d>0)return ANCESTOR_LABELS[d]||(d+"x Great-grandmother");
 d=chainDistance(nodeId,selectedId);
 if(d>0)return DESCENDANT_LABELS[d]||(d+"x Great-grandchild");
 return "";
}
// Builds the full family tree (every mother→child link, branching) starting at animalId.
function buildFamilyTree(animalId,guard){
 guard=guard||{n:0};
 const a=findAnimal(animalId);
 if(!a||guard.n>400)return null;
 guard.n++;
 const kids=animals().filter(x=>x.motherId===animalId).sort((p,q)=>(p.dob||"").localeCompare(q.dob||"")).map(c=>buildFamilyTree(c.id,guard)).filter(Boolean);
 return {...a,children:kids};
}
function famCardHTML(node,selectedId){

 const rel=relationLabel(node.id,selectedId);
 return `<div class="fam-card ${node.id===selectedId?"selected":""}">
  <div class="fam-relation">${rel?esc(rel):(node.id===selectedId?"Selected":"")}</div>
  <div class="fam-avatar">${node.photo?`<img src="${esc(node.photo)}">`:"🐄"}</div>
  <div class="fam-name">${esc(node.name||"Unnamed")}</div>
  <div class="fam-sub">${esc(node.id)}</div>
  <div class="mt-1">${badge(node.status)}</div>
 </div>`;
}
function renderFamNode(node,selectedId){
 if(!node)return"";
 const kids=node.children&&node.children.length?`<ul>${node.children.map(c=>`<li>${renderFamNode(c,selectedId)}</li>`).join("")}</ul>`:"";
 return famCardHTML(node,selectedId)+kids;
}

 </main></div>`;
 renderPage();

async function loadAll(){
  await Promise.all(paths.map(p=>new Promise(res=>{
   let firstSnapshot=true;
   db.ref(p).on("value",s=>{
    state.data[p]=s.val()||{};
    if(firstSnapshot){firstSnapshot=false;res();}
    else if(document.getElementById("content")){renderPage();}
   },err=>{console.error(p,err);if(firstSnapshot){firstSnapshot=false;res()}});
  })));
  if(localStorage.gaushalaLoggedIn==="1"&&ROLE_PERMISSIONS[localStorage.gaushalaRole]!==undefined){
   state.role=localStorage.gaushalaRole;
   if(isModuleHidden(state.page))state.page=state.role==="Management Team"?"Milk":"Dashboard";
   renderShell();
  }else{
   loginScreen();
  }
}

function buildAlerts(){
 const alerts=[];
 list("pregnancies").forEach(p=>{
  if(!p.expectedCalvingDate)return;
  const d=daysTo(p.expectedCalvingDate);
  if(d<=30){
   const an=findAnimal(p.animalId);
   alerts.push({type:"Pregnancy / Calving",icon:"🤰",animalId:p.animalId,animalName:an?an.name:"",due:p.expectedCalvingDate,days:d,extra:`Breeding: ${fmt(p.breedingDate)}`});
  }
 });
 [["vaccinations","Vaccination","💉"],["deworming","Deworming","🛡️"],["tickControl","Tick Control","🪲"],["nailCutting","Nail Cutting","✂️"]].forEach(([path,label,icon])=>{
  const latestByAnimal={};
  list(path).forEach(r=>{const k=r.animalId||"—";if(!latestByAnimal[k]||(r.date||"")>(latestByAnimal[k].date||""))latestByAnimal[k]=r});
  Object.values(latestByAnimal).forEach(r=>{
   if(!r.nextDueDate)return;
   const d=daysTo(r.nextDueDate);
   if(d<=15){
    const an=findAnimal(r.animalId);
    alerts.push({type:label,icon,animalId:r.animalId,animalName:an?an.name:"",due:r.nextDueDate,days:d,extra:""});
   }
  });
 });
 alerts.sort((x,y)=>x.days-y.days);
 return alerts;
}
function dashboard(){
 const allAnimals=animals(), deceased=allAnimals.filter(x=>x.status==="Deceased"), a=allAnimals.filter(x=>x.status!=="Deceased");
 const preg=a.filter(x=>x.pregnant||x.status==="Pregnant"), sick=a.filter(x=>["Sick","Emergency","Under Treatment"].includes(x.status)), lac=a.filter(x=>x.status==="Lactating"), calves=a.filter(x=>x.type==="Calf"), male=a.filter(x=>x.gender==="Male"), female=a.filter(x=>x.gender==="Female");
 const milk=list("milkRecords"), milkToday=milk.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.morning||0)+Number(x.evening||0),0);
 const alerts=buildAlerts();
 return `<div>${pageHeader("Namaste 👋","Aaj ki gaushala ki important information ek jagah.",isModuleViewOnly("Animals")?"":`<button class="btn btn-primary" onclick="openAnimal()">＋ Add Animal</button>`,"Yahan gaushala ka overall summary dikhta hai — kitne animals hain, aaj kitna doodh nikla, kaunsi cow pregnant ya sick hai. Roz subah sabse pehle yahi dekhein.")}
 <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3 mb-3">
 ${stat("Total",a.length,"🐄")}${stat("Female",female.length,"♀")}${stat("Male",male.length,"♂")}${stat("Calves",calves.length,"🐮")}${stat("Pregnant",preg.length,"🤰")}${stat("Lactating",lac.length,"🥛")}${stat("Sick",sick.length,"⚠")}
 </div>

const ANIMAL_LINKED_PATHS=["pregnancies","healthChecks","vaccinations","deworming","tickControl","nailCutting","milkRecords","births"];
async function deleteAnimal(animalId){
 if(isModuleViewOnly("Animals")){toast(`${state.role} role ke paas yeh permission nahi hai`,false);return}
 const a=findAnimal(animalId);
 if(!confirm(`${animalId}${a&&a.name?" ("+a.name+")":""} ko delete karein? Iske saath judi pregnancy, milk, health, vaccination, deworming, tick control, nail cutting aur birth records bhi delete ho jayenge — yeh wapas nahi ho sakta.`))return;
 try{
  const ops=[remove("animals",animalId)];
  ANIMAL_LINKED_PATHS.forEach(path=>{
   list(path).filter(r=>r.animalId===animalId).forEach(r=>ops.push(remove(path,r.id)));
  });
  await Promise.all(ops);
  toast("Animal aur uska poora linked data delete ho gaya");
 }catch(e){toast(e.message,false)}
}

function genericTable(type,rows){
 if(!rows.length)return `<div class="py-14 text-center text-slate-400">No records yet. Add the first record.</div>`;
 const viewOnly=isModuleViewOnly(type);
 // NOTE: Firebase returns object keys in alphabetical order, not insertion order — so we
 // must build columns from recordFields (the order YOU defined the form in), not from
 // Object.keys(rows[0]). This is what was making table columns look scrambled/wrong.
 const fieldDefs=recordFields[type];
 const cols=fieldDefs
   ?fieldDefs.map(f=>({key:f[0],label:f[1]}))
   :Object.keys(rows[0]).filter(k=>!["id","updatedAt","createdAt"].includes(k)).slice(0,6).map(k=>({key:k,label:k.replace(/([A-Z])/g," $1")}));
 return `<div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-xs uppercase text-slate-400">${cols.map(c=>`<th class="p-3 text-left">${esc(c.label)}</th>`).join("")}<th></th></tr></thead><tbody>${rows.slice(0,100).map(x=>`<tr class="border-b">${cols.map(c=>`<td class="p-3">${c.key.toLowerCase().includes("date")?fmt(x[c.key]):c.key==="status"?badge(x[c.key]):esc(x[c.key])}</td>`).join("")}<td class="p-3 text-right">${viewOnly?`<span class="text-xs text-slate-400">View only</span>`:`<div class="flex gap-2 justify-end"><button class="btn btn-soft !p-2" onclick="openRecord('${type}','${x.id}')">Edit</button><button class="btn btn-danger !p-2" onclick="deleteRecord('${type}','${x.id}')">Delete</button></div>`}</td></tr>`).join("")}</tbody></table></div>`
}

function openRecord(type,key){
 const fields=recordFields[type];
 if(!fields){toast(`Unknown record type: ${type}`,false);return}
 if(isModuleHidden(type)||isModuleViewOnly(type)){toast(`${state.role} role ke paas is action ki permission nahi hai`,false);return}
 const existing=key?list(recordPaths[type]).find(r=>r.id===key):null;
 let html=formGrid(fields.map(([n,l,t,isAnimal])=>{
   if(t.startsWith("select:"))return select(l,n,t.slice(7).split("|"),existing?existing[n]:"");
   const val=existing?existing[n]:(n.toLowerCase().includes("date")?today():"");
   const extra=isAnimal?'list="animalIds" placeholder="Animal ID or group name"':"";
   return field(l,n,val,t,extra);
 }).join(""));
 if(fields.some(f=>f[3]))html+=animalDatalist();
 modal(`${key?"Edit":"Add"} ${type} Record`,html,`<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitRecord('${type}','${key||""}')">Save Record</button>`);
}

 if(!fields||!path){toast(`Unknown record type: ${type}`,false);return}
 let d={};document.querySelectorAll("#modalRoot [name]").forEach(x=>d[x.name]=x.value);
 const [requiredName,requiredLabel]=fields[0];
 if(!d[requiredName]){toast(`${requiredLabel} is required`,false);return}
 if(!key)d.createdAt=new Date().toISOString();
 try{

  if(type==="Calves"&&!key){
   // Blood Line only works off the Animal "motherId" field, so a birth record on its
   // own doesn't show up there. Auto-create (or link) the calf as a real Animal here.
   const mother=findAnimal(d.animalId);
   let calfId=(d.calfId||"").trim();
   if(!calfId)calfId=id("CALF");
   if(calfId===d.animalId){toast("Calf ID Mother ID jaisa nahi ho sakta — apne aap ki mother nahi ban sakti",false);return}
   if(motherChainIncludes(d.animalId,calfId)){toast("Yeh combination circular blood line banayegi — Calf ID check karein",false);return}
   if(findAnimal(calfId)){
    await db.ref("animals/"+calfId).update({motherId:d.animalId});

   }
   d.calfId=calfId;
  }
  await save(path,key||id(type.toUpperCase().replace(/ /g,"")),d);
  toast(`${type} record saved`);closeModal();
 }catch(e){toast(e.message,false)}
}
// One-time fixer: for any Calves birth record that doesn't have a matching Animal
// profile yet (e.g. added before this linking existed, or the Calf ID was edited later),
// create/relink that Animal so it shows up in Animals and in Blood Line.
async function repairCalfLinks(){
 const births=list("births");
 if(!births.length){toast("Koi birth record nahi mila",false);return}
 const ops=[];let fixed=0;
 for(const b of births){
  const mother=findAnimal(b.animalId);
  let calfId=(b.calfId||"").trim();
  if(calfId&&findAnimal(calfId)){
   const a=findAnimal(calfId);
   if(a.motherId!==b.animalId){ops.push(db.ref("animals/"+calfId).update({motherId:b.animalId}));fixed++}
   continue;
  }
  if(!calfId)calfId=id("CALF");
  if(calfId===b.animalId)continue; // skip bad data, same fix as the create-time guard
  if(findAnimal(calfId)){
   ops.push(db.ref("animals/"+calfId).update({motherId:b.animalId}));
  }else{
   ops.push(save("animals",calfId,{id:calfId,name:"",gender:b.gender||"Female",type:"Calf",breed:mother?mother.breed:"",dob:b.birthDate||today(),shed:mother?mother.shed:"",status:"Healthy",earTag:"",joinedDate:today(),notes:b.notes||"",motherId:b.animalId,fatherId:"",deathDate:"",deathReason:""}));
  }
  ops.push(db.ref("births/"+b.id).update({calfId}));
  fixed++;
 }
 if(!ops.length){toast("Sab birth records already Animal profile se linked hain");return}
 try{await Promise.all(ops);toast(`${fixed} birth record ka calf profile bana/link kiya gaya`)}catch(e){toast(e.message,false)}
}

 const selector=`<div class="card p-5 mb-5"><label class="block text-sm font-semibold text-slate-600">Select Animal<select class="input mt-1 max-w-sm" onchange="state.bloodlineAnimal=this.value;renderPage()">${opts.map(a=>`<option value="${esc(a.id)}" ${a.id===selected?"selected":""}>${esc(a.id)} · ${esc(a.name||"Unnamed")}</option>`).join("")}</select></label></div>`;

 // Walk up to the topmost resolvable ancestor — that becomes the root of the tree.

// ---- Photo capture + compression + Cloudinary upload ----
function compressImage(file,maxDim=1280,quality=0.72){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Could not read the selected file"));
  reader.onload=e=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("That file doesn't look like a valid image"));
   img.onload=()=>{
    let {width,height}=img;
    if(width>height&&width>maxDim){height=Math.round(height*maxDim/width);width=maxDim}
    else if(height>=width&&height>maxDim){width=Math.round(width*maxDim/height);height=maxDim}
    const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,width,height);
    canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Image compression failed")),"image/jpeg",quality);
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

async function handlePhotoSelected(e){
 const file=e.target.files&&e.target.files[0];

 if(!state.cloud.name||!state.cloud.preset){toast("Add your Cloudinary Cloud Name and Upload Preset in Settings first",false);return}
 const statusEl=document.getElementById("photoStatus");
 try{
  if(statusEl)statusEl.innerHTML=`<span class="spinner border-slate-400"></span> Compressing image...`;
  const originalKb=(file.size/1024).toFixed(0);
  const blob=await compressImage(file);
  if(statusEl)statusEl.innerHTML=`<span class="spinner border-slate-400"></span> Uploading (${fmtBytes(blob.size)}, was ${originalKb} KB)...`;
  const fd=new FormData();
  fd.append("file",blob,"photo.jpg");
  fd.append("upload_preset",state.cloud.preset);
  fd.append("folder","gaushala/animals");
  const res=await fetch(`https://api.cloudinary.com/v1_1/${state.cloud.name}/image/upload`,{method:"POST",body:fd});
  const data=await res.json();
  if(!res.ok)throw new Error(data?.error?.message||"Cloudinary upload failed");
  window.currentPhoto=data.secure_url;
  if(statusEl)statusEl.textContent=`Uploaded ✓ (${fmtBytes(blob.size)}, compressed from ${originalKb} KB)`;
  const wrap=document.getElementById("photoPreviewWrap");
  if(wrap)wrap.innerHTML=`<img id="photoPreview" src="${esc(data.secure_url)}" class="mt-2 w-20 h-20 object-cover rounded-lg border">`;
  toast("Photo uploaded");
  await db.ref("mediaLog/"+id("MED")).set({publicId:data.public_id,url:data.secure_url,bytes:blob.size,createdAt:new Date().toISOString()});
 }catch(err){
  if(statusEl)statusEl.textContent="Upload failed — try again";
  toast(err.message,false);
 }
}

function downloadReportPDF(key){
 if(!window.jspdf){toast("PDF library load nahi hui — internet connection check karein",false);return}
 const cfg=REPORT_CONFIGS[key];
 if(!cfg){toast("Report not available",false);return}
 const rows=cfg.rows();
 if(!rows.length){toast("Is report ke liye abhi koi data nahi hai",false);return}
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({orientation:"landscape",unit:"pt"});
 doc.setFontSize(16);doc.setTextColor(20,83,45);doc.text(`Gaushala — ${key}`,40,36);
 doc.setFontSize(9);doc.setTextColor(100);doc.text(`Generated: ${fmt(today())} · Records: ${rows.length}`,40,52);
 const head=[cfg.columns.map(c=>c[0])];
 const body=rows.map(r=>cfg.columns.map(c=>{
  const v=typeof c[1]==="function"?c[1](r):r[c[1]];
  return (typeof c[1]==="string"&&c[1].toLowerCase().includes("date"))?fmt(v):(v===undefined||v===null||v===""?"—":String(v));
 }));
 doc.autoTable({head,body,startY:66,margin:{left:40,right:40},styles:{fontSize:8,cellPadding:5},headStyles:{fillColor:[22,101,52],textColor:255},alternateRowStyles:{fillColor:[240,253,244]}});
 doc.save(`gaushala-${key.toLowerCase().replace(/[^a-z0-9]+/g,"-")}-${today()}.pdf`);
 toast("PDF download shuru ho gayi");
}
function exportAnimals(){downloadReportPDF("Animal Master")}
window.go=go;window.toggleSide=toggleSide;window.openAnimal=openAnimal;window.deleteAnimal=deleteAnimal;window.openPregnancy=openPregnancy;window.closeModal=closeModal;window.submitAnimal=submitAnimal;window.submitPregnancy=submitPregnancy;window.openRecord=openRecord;window.submitRecord=submitRecord;window.deleteRecord=deleteRecord;window.triggerPhotoInput=triggerPhotoInput;window.handlePhotoSelected=handlePhotoSelected;window.saveCloudSettings=saveCloudSettings;window.exportAnimals=exportAnimals;window.state=state;window.renderPage=renderPage;window.attemptLogin=attemptLogin;window.logout=logout;window.saveMilkEntries=saveMilkEntries;window.updateMilkRowTotal=updateMilkRowTotal;window.repairCalfLinks=repairCalfLinks;

auth.signInAnonymously().catch(e=>console.warn("Anonymous Auth is not enabled; configure Firebase Auth or use your own login.",e.message));
loadAll().catch(e=>{document.getElementById("app").innerHTML=`<div class="p-10 max-w-2xl mx-auto"><div class="card p-6"><h1 class="text-xl font-bold text-red-700">Firebase connection error</h1><p class="mt-2 text-slate-600">${esc(e.message)}</p><p class="mt-3 text-sm text-slate-500">Check Realtime Database rules and enable Anonymous Authentication if using this starter.</p></div></div>`});
</script>
